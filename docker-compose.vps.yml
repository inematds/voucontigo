# Deploy na VPS (Caddy já existente faz o TLS e o proxy).
# Uso: docker compose -f docker-compose.vps.yml --env-file .env up -d --build
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_EMPRESA: ${NEXT_PUBLIC_WHATSAPP_EMPRESA}
    env_file: .env
    restart: unless-stopped
    networks: [web]
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  web:
    external: true
    name: inemadlp_default
